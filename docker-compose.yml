services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepass
      POSTGRES_DB: storeaccounts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://store:storepass@db:5432/storeaccounts
      SESSION_SECRET: change-this-to-a-long-random-string
      PORT: 3000
      COOKIE_SECURE: "false" # set "true" when serving behind HTTPS
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
